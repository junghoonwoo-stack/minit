name: Live Minit dogfood

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dogfood-live.yml"

permissions:
  contents: write

jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Minit development main
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          minit --help >/tmp/minit-help.txt

      - name: Create three local demo apps
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/minit-dogfood
          mkdir -p "$ROOT/dashboard" "$ROOT/map" "$ROOT/monitor"

          cat > "$ROOT/dashboard/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minit Live Data Dashboard</title>
          <style>
          *{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e9eefc;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:34px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px}.tag{color:#78a6ff;font-weight:800;font-size:12px;letter-spacing:.14em}.live{display:flex;gap:8px;align-items:center;color:#8de0aa}.dot{width:9px;height:9px;border-radius:50%;background:#51d47b;box-shadow:0 0 15px #51d47b}h1{font-size:38px;margin:8px 0}.sub{color:#9ba8c7}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}.card,.panel{background:#121a31;border:1px solid #253251;border-radius:16px;padding:20px}.k{color:#95a3c3;font-size:13px}.v{font-size:30px;font-weight:800;margin-top:8px}.delta{font-size:12px;color:#70d89a}.grid{display:grid;grid-template-columns:1.45fr .85fr;gap:14px}.bars{height:250px;display:flex;gap:12px;align-items:end;padding-top:30px}.bar{flex:1;border-radius:8px 8px 3px 3px;background:linear-gradient(#7aa8ff,#486fe5);min-height:20px;transition:height .7s ease}.row{display:flex;justify-content:space-between;border-bottom:1px solid #253251;padding:12px 0}.row:last-child{border:0}.mini{color:#9ba8c7;font-size:12px}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
          </style></head><body><div class="wrap"><div class="top"><div><div class="tag">MINIT DOGFOOD · LOCAL APP</div><h1>Operations Dashboard</h1><div class="sub">Simulated business telemetry · generated in the browser · served from a Minit-managed local process</div></div><div class="live"><span class="dot"></span> LIVE <span id="clock"></span></div></div>
          <div class="cards"><div class="card"><div class="k">TODAY REVENUE</div><div class="v" id="revenue">₩128.4M</div><div class="delta" id="revd">▲ 8.1%</div></div><div class="card"><div class="k">ACTIVE USERS</div><div class="v" id="users">1,482</div><div class="delta">▲ live now</div></div><div class="card"><div class="k">ORDERS / MIN</div><div class="v" id="orders">42</div><div class="delta">healthy</div></div><div class="card"><div class="k">ERROR RATE</div><div class="v" id="errors">0.18%</div><div class="delta">within SLO</div></div></div>
          <div class="grid"><div class="panel"><div class="k">LIVE ACTIVITY · LAST 12 INTERVALS</div><div class="bars" id="bars"></div><div class="mini">Values change every 2 seconds to make this a visibly live app.</div></div><div class="panel"><div class="k">REGION STATUS</div><div class="row"><span>Seoul</span><b id="seoul">97%</b></div><div class="row"><span>Busan</span><b id="busan">91%</b></div><div class="row"><span>Daejeon</span><b id="daejeon">88%</b></div><div class="row"><span>Jeju</span><b id="jeju">82%</b></div><div class="mini" style="margin-top:14px">Compute: GitHub runner acting as a clean local PC<br>Runtime: Minit local supervisor</div></div></div></div>
          <script>const bars=document.getElementById('bars');let vals=[42,55,48,68,72,61,75,81,70,88,83,92];function draw(){bars.innerHTML='';vals.forEach(x=>{let e=document.createElement('div');e.className='bar';e.style.height=x+'%';bars.appendChild(e)})}draw();function tick(){vals.shift();vals.push(45+Math.random()*50);draw();let u=1450+Math.floor(Math.random()*120);document.getElementById('users').textContent=u.toLocaleString();document.getElementById('orders').textContent=35+Math.floor(Math.random()*18);document.getElementById('errors').textContent=(.10+Math.random()*.18).toFixed(2)+'%';document.getElementById('revenue').textContent='₩'+(128+Math.random()*2).toFixed(1)+'M';['seoul','busan','daejeon','jeju'].forEach((id,i)=>document.getElementById(id).textContent=(80+Math.random()*19).toFixed(0)+'%');document.getElementById('clock').textContent=new Date().toLocaleTimeString()}setInterval(tick,2000);tick()</script></body></html>
          HTML

          cat > "$ROOT/map/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minit Live Fleet Map</title>
          <style>*{box-sizing:border-box}body{margin:0;background:#08131a;color:#e5f3f5;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.tag{color:#61d3ba;font-size:12px;font-weight:800;letter-spacing:.12em}h1{margin:7px 0;font-size:35px}.sub{color:#8ca7ad}.live{color:#72e6a0}.map{position:relative;height:610px;margin-top:22px;border:1px solid #25434b;border-radius:20px;overflow:hidden;background:#0c2028}.map svg{width:100%;height:100%}.marker{position:absolute;transform:translate(-50%,-50%);transition:left 1.3s linear,top 1.3s linear}.pin{width:17px;height:17px;border:3px solid #bfffee;background:#30d1ad;border-radius:50%;box-shadow:0 0 18px #30d1ad}.label{position:absolute;white-space:nowrap;left:14px;top:-8px;background:#0a151be8;border:1px solid #315761;border-radius:8px;padding:5px 8px;font-size:11px}.legend{position:absolute;right:18px;bottom:18px;background:#09171de8;border:1px solid #315761;padding:14px;border-radius:12px;font-size:12px}.road{stroke:#31525b;stroke-width:5;fill:none}.river{stroke:#123e60;stroke-width:28;fill:none}.district{fill:#102c34;stroke:#234751;stroke-width:1.5}.name{fill:#72949c;font-size:18px}.pulse{animation:p 1.5s infinite}@keyframes p{50%{box-shadow:0 0 28px #60f7cf;transform:scale(1.15)}}@media(max-width:700px){.map{height:520px}}</style></head><body><div class="wrap"><div class="top"><div><div class="tag">MINIT DOGFOOD · LIVE LOCATION DEMO</div><h1>Seoul Metro Fleet</h1><div class="sub">Simulated delivery units moving around a stylized Seoul-area map. No real user location data.</div></div><div class="live">● LIVE · <span id="clock"></span></div></div>
          <div class="map" id="map"><svg viewBox="0 0 1000 610" preserveAspectRatio="none"><path class="district" d="M70 90 L310 50 430 155 300 280 60 240Z"/><path class="district" d="M430 155 L720 80 930 165 820 310 560 285Z"/><path class="district" d="M60 300 L330 275 480 390 350 560 80 520Z"/><path class="district" d="M500 320 L820 310 950 430 760 565 480 500Z"/><path class="river" d="M-20 300 C180 260 290 360 470 315 S760 250 1020 325"/><path class="road" d="M120 150 C330 180 540 120 850 180"/><path class="road" d="M180 480 C350 380 620 420 860 490"/><path class="road" d="M290 70 C350 210 420 370 500 560"/><path class="road" d="M720 80 C650 210 650 390 680 560"/><text x="130" y="175" class="name">Goyang</text><text x="480" y="205" class="name">Seoul</text><text x="735" y="210" class="name">Guri</text><text x="190" y="455" class="name">Bucheon</text><text x="540" y="475" class="name">Seongnam</text><text x="790" y="460" class="name">Hanam</text></svg>
          <div class="legend"><b>5 simulated units</b><br>Positions refresh every 1.5 sec<br><span style="color:#30d1ad">●</span> normal &nbsp; <span style="color:#ffd76a">●</span> delayed</div></div></div>
          <script>let units=[['M-01',46,38],['M-02',58,50],['M-03',37,69],['M-04',72,33],['M-05',66,75]],map=document.getElementById('map');units.forEach((u,i)=>{let m=document.createElement('div');m.className='marker';m.id='m'+i;m.innerHTML='<div class="pin pulse"></div><div class="label">'+u[0]+' · '+(i===3?'delayed':'en route')+'</div>';map.appendChild(m)});function tick(){units=units.map((u,i)=>[u[0],Math.max(8,Math.min(92,u[1]+(Math.random()-.5)*6)),Math.max(10,Math.min(90,u[2]+(Math.random()-.5)*6))]);units.forEach((u,i)=>{let m=document.getElementById('m'+i);m.style.left=u[1]+'%';m.style.top=u[2]+'%'});document.getElementById('clock').textContent=new Date().toLocaleTimeString()}setInterval(tick,1500);tick()</script></body></html>
          HTML

          cat > "$ROOT/monitor/server.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import json, os, time, psutil
          START=time.time()
          HTML='''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minit Local System Monitor</title><style>*{box-sizing:border-box}body{margin:0;background:#111015;color:#f1edf7;font-family:Inter,system-ui,sans-serif}.w{max-width:980px;margin:auto;padding:34px}.tag{font-size:12px;font-weight:800;letter-spacing:.12em;color:#c193ff}h1{font-size:38px;margin:8px 0}.sub{color:#aaa0b9}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:28px 0}.c,.p{background:#191720;border:1px solid #36303f;border-radius:17px;padding:21px}.k{color:#a99fb9;font-size:12px}.v{font-weight:800;font-size:34px;margin:8px 0}.meter{height:10px;background:#2b2732;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8d63ff,#d283ff);transition:width .6s}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #312c39}.row:last-child{border:0}.live{color:#73dd9b}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="tag">MINIT DOGFOOD · REAL LOCAL METRICS</div><h1>Local System Monitor</h1><div class="sub">These numbers are read from the machine that is actually running this Minit-managed app.</div><div class="cards"><div class="c"><div class="k">CPU</div><div class="v" id="cpu">—</div><div class="meter"><div class="fill" id="cpub"></div></div></div><div class="c"><div class="k">MEMORY</div><div class="v" id="mem">—</div><div class="meter"><div class="fill" id="memb"></div></div></div><div class="c"><div class="k">LOAD AVG</div><div class="v" id="load">—</div><div class="live">● polling every second</div></div></div><div class="p"><div class="row"><span>Host CPUs</span><b id="cores">—</b></div><div class="row"><span>Python process RSS</span><b id="rss">—</b></div><div class="row"><span>System uptime</span><b id="up">—</b></div><div class="row"><span>App uptime</span><b id="appup">—</b></div><div class="row"><span>Runtime model</span><b>Minit local process</b></div></div></div><script>function fmt(s){s=Math.floor(s);return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m '+s%60+'s'}async function tick(){let x=await fetch('/metrics').then(r=>r.json());cpu.textContent=x.cpu.toFixed(1)+'%';cpub.style.width=x.cpu+'%';mem.textContent=x.mem.toFixed(1)+'%';memb.style.width=x.mem+'%';load.textContent=x.load.toFixed(2);cores.textContent=x.cores;rss.textContent=x.rss_mb.toFixed(1)+' MB';up.textContent=fmt(x.uptime);appup.textContent=fmt(x.app_uptime)}setInterval(tick,1000);tick()</script></body></html>'''
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith('/metrics'):
                      vm=psutil.virtual_memory(); payload={'cpu':psutil.cpu_percent(interval=None),'mem':vm.percent,'load':os.getloadavg()[0],'cores':psutil.cpu_count(),'rss_mb':psutil.Process().memory_info().rss/1024/1024,'uptime':time.time()-psutil.boot_time(),'app_uptime':time.time()-START}
                      body=json.dumps(payload).encode(); self.send_response(200); self.send_header('Content-Type','application/json'); self.send_header('Cache-Control','no-store'); self.end_headers(); self.wfile.write(body)
                  else:
                      body=HTML.encode(); self.send_response(200); self.send_header('Content-Type','text/html; charset=utf-8'); self.send_header('Cache-Control','no-store'); self.end_headers(); self.wfile.write(body)
              def log_message(self,*args): pass
          ThreadingHTTPServer(('127.0.0.1',8813),H).serve_forever()
          PY

      - name: Deploy all apps to this computer with Minit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/minit-dogfood
          (cd "$ROOT/dashboard" && minit deploy --port 8811 -- python -m http.server 8811 --bind 127.0.0.1)
          (cd "$ROOT/map" && minit deploy --port 8812 -- python -m http.server 8812 --bind 127.0.0.1)
          (cd "$ROOT/monitor" && minit deploy --port 8813 -- python server.py)
          sleep 2
          curl -fsS http://127.0.0.1:8811/ | grep -q 'Operations Dashboard'
          curl -fsS http://127.0.0.1:8812/ | grep -q 'Seoul Metro Fleet'
          curl -fsS http://127.0.0.1:8813/metrics | grep -q 'cpu'
          (cd "$ROOT/dashboard" && minit status > /tmp/dashboard-status.txt)
          (cd "$ROOT/map" && minit status > /tmp/map-status.txt)
          (cd "$ROOT/monitor" && minit status > /tmp/monitor-status.txt)

      - name: Open temporary public URLs with Minit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/minit-dogfood
          (cd "$ROOT/dashboard" && minit run --port 8811 > /tmp/dashboard-tunnel.log 2>&1) &
          echo $! >/tmp/dashboard-tunnel.pid
          (cd "$ROOT/map" && minit run --port 8812 > /tmp/map-tunnel.log 2>&1) &
          echo $! >/tmp/map-tunnel.pid
          (cd "$ROOT/monitor" && minit run --port 8813 > /tmp/monitor-tunnel.log 2>&1) &
          echo $! >/tmp/monitor-tunnel.pid

          python - <<'PY'
          import re,time,sys,pathlib
          files={'dashboard':'/tmp/dashboard-tunnel.log','map':'/tmp/map-tunnel.log','monitor':'/tmp/monitor-tunnel.log'}
          pat=re.compile(r'https://[a-zA-Z0-9-]+\.trycloudflare\.com')
          urls={}
          deadline=time.time()+150
          while time.time()<deadline:
              for name,p in files.items():
                  if name in urls: continue
                  try: text=pathlib.Path(p).read_text(errors='ignore')
                  except FileNotFoundError: continue
                  m=pat.search(text)
                  if m: urls[name]=m.group(0)
              if len(urls)==3: break
              time.sleep(2)
          if len(urls)!=3:
              print('Could not discover all URLs',urls)
              for n,p in files.items():
                  print('\n---',n,'---')
                  try: print(pathlib.Path(p).read_text(errors='ignore')[-5000:])
                  except: pass
              sys.exit(1)
          for name,url in urls.items():
              pathlib.Path('/tmp/'+name+'-url.txt').write_text(url)
              print(name,url)
          PY

          for n in dashboard map monitor; do
            url=$(cat /tmp/$n-url.txt)
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 10 "$url" >/tmp/$n-public.html; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          done

      - name: Publish temporary URLs for the test
        shell: bash
        run: |
          set -euo pipefail
          DASH=$(cat /tmp/dashboard-url.txt)
          MAP=$(cat /tmp/map-url.txt)
          MON=$(cat /tmp/monitor-url.txt)
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          cat > dogfood-live-urls.md <<EOF
          # Minit live dogfood URLs

          Generated: **$NOW**

          These are real temporary Cloudflare Quick Tunnel URLs opened by **Minit** from three apps running locally on one clean GitHub-hosted Linux machine.

          - **Live Data Dashboard:** $DASH
          - **Live Location Map:** $MAP
          - **Local System Monitor:** $MON

          The workflow keeps the local machine and tunnels alive for roughly **40 minutes after publication**. The URLs disappear when the runner exits.

          Test path for each app:

          \`demo source → minit deploy → local supervisor → minit run → trycloudflare URL → external curl PASS\`

          No application code or app data was uploaded as app compute; only tunnel traffic is relayed.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dogfood-live-urls.md
          git commit -m 'Publish temporary Minit dogfood URLs'
          git push

      - name: Keep local apps live for interactive testing
        run: |
          echo 'Minit dogfood apps are live; keeping this clean local machine running for 40 minutes.'
          sleep 2400
