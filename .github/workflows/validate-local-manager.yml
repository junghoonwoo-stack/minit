name: Validate local manager

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-local-manager.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: SHOULD_NOT_LEAK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate current local manager
        shell: bash
        run: |
          LOG=/tmp/minit-local-manager-validation.txt
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          set +e

          python -m pip install -e ".[dev]"
          install_rc=$?
          pytest -q
          test_rc=$?

          deploy_rc=99
          ready=0
          status_rc=99
          metrics_ok=1
          env_ok=1
          stop_rc=99
          stopped=0

          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            rm -rf /tmp/minit-manager-e2e
            mkdir -p /tmp/minit-manager-e2e
            cd /tmp/minit-manager-e2e
            cat > app.py <<'PY'
          import os
          from pathlib import Path
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler

          Path("env.txt").write_text(os.getenv("OPENAI_API_KEY", "missing"), encoding="utf-8")
          ThreadingHTTPServer(("127.0.0.1", 8775), SimpleHTTPRequestHandler).serve_forever()
          PY

            minit deploy --port 8775 -- python app.py
            deploy_rc=$?
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8775/env.txt -o /tmp/env.txt; then
                ready=1
                break
              fi
              sleep 1
            done

            minit status | tee /tmp/status.txt
            status_rc=${PIPESTATUS[0]}
            grep -q "memory:" /tmp/status.txt && grep -q "CPU:" /tmp/status.txt
            metrics_ok=$?
            grep -q '^missing$' /tmp/env.txt
            env_ok=$?

            minit stop
            stop_rc=$?
            for i in $(seq 1 20); do
              if ! curl -fsS http://127.0.0.1:8775 >/dev/null 2>&1; then
                stopped=1
                break
              fi
              sleep 0.5
            done
          fi

          echo "install_rc=$install_rc"
          echo "test_rc=$test_rc"
          echo "deploy_rc=$deploy_rc"
          echo "ready=$ready"
          echo "status_rc=$status_rc"
          echo "metrics_ok=$metrics_ok"
          echo "env_ok=$env_ok"
          echo "stop_rc=$stop_rc"
          echo "stopped=$stopped"

          result=failure
          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ] && [ "$deploy_rc" -eq 0 ] && [ "$ready" -eq 1 ] && [ "$status_rc" -eq 0 ] && [ "$metrics_ok" -eq 0 ] && [ "$env_ok" -eq 0 ] && [ "$stop_rc" -eq 0 ] && [ "$stopped" -eq 1 ]; then
            result=success
          fi
          echo "result=$result"

          cd "$GITHUB_WORKSPACE"
          cp "$LOG" local-manager-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-manager-validation.txt
          git commit -m "Record local manager validation" || true
          git push
