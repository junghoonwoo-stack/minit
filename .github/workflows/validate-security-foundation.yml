name: Validate security foundation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-security-foundation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: SHOULD_NOT_LEAK_FROM_PARENT_ENV
      AWS_SECRET_ACCESS_KEY: SHOULD_NOT_LEAK_EITHER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate unit tests and local environment isolation
        shell: bash
        run: |
          LOG=/tmp/minit-security-validation.txt
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          set +e

          python -m pip install -e ".[dev]"
          install_rc=$?
          pytest -q
          test_rc=$?

          deploy_rc=99
          app_ready=0
          env_isolated=1
          stop_rc=99
          stopped=0

          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            rm -rf /tmp/minit-env-e2e
            mkdir -p /tmp/minit-env-e2e
            cd /tmp/minit-env-e2e

            cat > app.py <<'PY'
          import os
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from pathlib import Path

          Path("env-result.txt").write_text(
              "OPENAI=" + os.getenv("OPENAI_API_KEY", "missing") + "\n" +
              "AWS=" + os.getenv("AWS_SECRET_ACCESS_KEY", "missing") + "\n" +
              "RUNTIME=" + os.getenv("MINIT_RUNTIME", "missing") + "\n",
              encoding="utf-8",
          )
          ThreadingHTTPServer(("127.0.0.1", 8770), SimpleHTTPRequestHandler).serve_forever()
          PY

            minit deploy --port 8770 -- python app.py
            deploy_rc=$?

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8770/env-result.txt -o /tmp/env-result.txt; then
                app_ready=1
                break
              fi
              sleep 1
            done

            if [ "$app_ready" -eq 1 ]; then
              cat /tmp/env-result.txt
              grep -q '^OPENAI=missing$' /tmp/env-result.txt && \
              grep -q '^AWS=missing$' /tmp/env-result.txt && \
              grep -q '^RUNTIME=local$' /tmp/env-result.txt
              env_isolated=$?
            fi

            minit stop
            stop_rc=$?
            for i in $(seq 1 20); do
              if ! curl -fsS http://127.0.0.1:8770 >/dev/null 2>&1; then
                stopped=1
                break
              fi
              sleep 0.5
            done
          fi

          echo "install_rc=$install_rc"
          echo "test_rc=$test_rc"
          echo "deploy_rc=$deploy_rc"
          echo "app_ready=$app_ready"
          echo "env_isolated=$env_isolated"
          echo "stop_rc=$stop_rc"
          echo "stopped=$stopped"

          result=failure
          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ] && [ "$deploy_rc" -eq 0 ] && [ "$app_ready" -eq 1 ] && [ "$env_isolated" -eq 0 ] && [ "$stop_rc" -eq 0 ] && [ "$stopped" -eq 1 ]; then
            result=success
          fi
          echo "result=$result"

          cd "$GITHUB_WORKSPACE"
          cp "$LOG" security-foundation-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-foundation-validation.txt
          git commit -m "Record security foundation validation" || true
          git push
