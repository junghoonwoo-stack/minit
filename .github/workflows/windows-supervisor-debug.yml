name: Windows supervisor debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug-supervisor:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and inspect failed deploy
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\minit-debug-venv"
          & "$env:RUNNER_TEMP\minit-debug-venv\Scripts\pip.exe" install .
          $app = "$env:RUNNER_TEMP\debug-app"
          New-Item -ItemType Directory -Force $app | Out-Null
          Set-Content "$app\index.html" "debug"
          Set-Location $app
          & "$env:RUNNER_TEMP\minit-debug-venv\Scripts\minit.exe" deploy
          $code = $LASTEXITCODE
          Write-Host "deploy-exit=$code"
          Write-Host "--- supervisor.log ---"
          if (Test-Path ".minit\logs\supervisor.log") { Get-Content ".minit\logs\supervisor.log" }
          Write-Host "--- runtime.json ---"
          if (Test-Path ".minit\runtime.json") { Get-Content ".minit\runtime.json" }
          Write-Host "--- environment probe ---"
          & "$env:RUNNER_TEMP\minit-debug-venv\Scripts\python.exe" -c "import os; from minit.environment import supervisor_environment; e=supervisor_environment(); print(sorted(e.keys())); print('SystemRoot=',repr(e.get('SystemRoot')),'SYSTEMROOT=',repr(e.get('SYSTEMROOT')),'WINDIR=',repr(e.get('WINDIR')))"
          if ($code -ne 0) { throw "deploy failed; diagnostics printed above" }
