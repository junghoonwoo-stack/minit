name: Validate local-first changes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-local-first.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validation
        id: validation
        continue-on-error: true
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
          minit --help
      - name: Record result
        run: |
          echo "${{ steps.validation.outcome }}" > local-first-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-first-validation.txt
          git commit -m "Record local-first validation result" || true
          git push
