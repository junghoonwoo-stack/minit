name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  local-manager-e2e:
    name: Multi-app local manager E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install current Minit
        run: python -m pip install -e .

      - name: Deploy and manage two local apps
        shell: bash
        env:
          MINIT_HOME: /tmp/minit-e2e-home
        run: |
          set -euo pipefail
          ROOT=/tmp/minit-local-manager-e2e
          mkdir -p "$ROOT/alpha" "$ROOT/beta"
          echo 'alpha-minit-e2e' > "$ROOT/alpha/index.html"
          echo 'beta-minit-e2e' > "$ROOT/beta/index.html"

          cleanup() {
            (cd /tmp && minit stop alpha >/dev/null 2>&1 || true)
            (cd /tmp && minit stop beta >/dev/null 2>&1 || true)
          }
          trap cleanup EXIT

          (cd "$ROOT/alpha" && minit deploy)
          (cd "$ROOT/beta" && minit deploy)

          PORT_A=$(python -c "import json; print(json.load(open('$ROOT/alpha/.minit/service.json'))['port'])")
          PORT_B=$(python -c "import json; print(json.load(open('$ROOT/beta/.minit/service.json'))['port'])")

          test "$PORT_A" != "$PORT_B"
          curl -fsS "http://127.0.0.1:$PORT_A" | grep -q 'alpha-minit-e2e'
          curl -fsS "http://127.0.0.1:$PORT_B" | grep -q 'beta-minit-e2e'

          cd /tmp
          minit ls | tee /tmp/minit-ls.txt
          grep -q 'alpha' /tmp/minit-ls.txt
          grep -q 'beta' /tmp/minit-ls.txt

          IDEMPOTENT=$(cd "$ROOT/alpha" && minit deploy)
          echo "$IDEMPOTENT" | grep -q 'Already running'

          minit stop alpha
          if curl -fsS --max-time 2 "http://127.0.0.1:$PORT_A" >/dev/null 2>&1; then
            echo 'alpha should have stopped' >&2
            exit 1
          fi
          curl -fsS "http://127.0.0.1:$PORT_B" | grep -q 'beta-minit-e2e'

          minit stop beta
          trap - EXIT

  package:
    name: Build and install package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install wheel
        run: |
          python -m venv /tmp/minit-package-test
          /tmp/minit-package-test/bin/python -m pip install dist/*.whl

      - name: Smoke test CLI
        run: /tmp/minit-package-test/bin/minit --help
