name: PR Live Minit Dogfood Artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["dogfood-pr-artifact-trigger.txt"]

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install current Minit
        run: python -m pip install -e .
      - name: Build and deploy two local apps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mdemo2/dash /tmp/mdemo2/map
          cat >/tmp/mdemo2/dash/index.html <<'EOF'
          <!doctype html><meta name=viewport content="width=device-width"><title>Minit Data Dashboard</title><style>body{margin:0;background:#0b1020;color:#eef3ff;font:16px system-ui}.w{max-width:960px;margin:auto;padding:35px}h1{font-size:40px}.tag{color:#74a2ff;font-weight:800}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c,.p{background:#121a31;border:1px solid #293756;border-radius:15px;padding:18px}.v{font-size:30px;font-weight:800}.bars{height:280px;display:flex;align-items:end;gap:9px}.b{flex:1;background:#668cff;border-radius:7px 7px 2px 2px;transition:.5s}.live{color:#72dfa0}@media(max-width:700px){.g{grid-template-columns:1fr 1fr}}</style><div class=w><div class=tag>MINIT · LIVE DOGFOOD</div><h1>Operations Dashboard</h1><p>App process is local to this machine. <span class=live>● LIVE</span></p><div class=g><div class=c>USERS<div id=u class=v></div></div><div class=c>ORDERS/MIN<div id=o class=v></div></div><div class=c>REVENUE<div id=r class=v></div></div><div class=c>ERROR<div id=e class=v></div></div></div><div class=p style="margin-top:14px"><b>LIVE ACTIVITY</b><div id=bars class=bars></div></div></div><script>let a=[35,50,42,60,68,57,74,82,64,88,77,94];function t(){a.shift();a.push(35+Math.random()*60);bars.innerHTML=a.map(x=>'<i class=b style="height:'+x+'%"></i>').join('');u.textContent=(1400+Math.random()*180|0).toLocaleString();o.textContent=35+Math.random()*20|0;r.textContent='₩'+(126+Math.random()*5).toFixed(1)+'M';e.textContent=(.1+Math.random()*.2).toFixed(2)+'%'}setInterval(t,1500);t()</script>
          EOF
          cat >/tmp/mdemo2/map/index.html <<'EOF'
          <!doctype html><meta name=viewport content="width=device-width"><title>Minit Live Fleet Map</title><style>body{margin:0;background:#07151b;color:#eaf7f8;font:16px system-ui}.w{max-width:960px;margin:auto;padding:30px}h1{font-size:38px}.tag{color:#57d3b5;font-weight:800}.map{height:590px;position:relative;background:#0d2831;border:1px solid #31525c;border-radius:18px;overflow:hidden}.map:before{content:'';position:absolute;left:-5%;top:47%;width:110%;height:46px;background:#123e5f;transform:rotate(3deg)}.road{position:absolute;height:5px;background:#31525c;width:100%;top:28%;transform:rotate(-8deg)}.r2{top:70%;transform:rotate(12deg)}.r3{width:5px;height:100%;left:48%;top:0;transform:rotate(7deg)}.m{position:absolute;transition:1.2s linear;transform:translate(-50%,-50%)}.dot{width:17px;height:17px;background:#38d2ae;border:3px solid #c3fff0;border-radius:50%;box-shadow:0 0 18px #38d2ae}.lbl{position:absolute;left:14px;top:-7px;white-space:nowrap;background:#07151bdd;padding:4px 7px;border:1px solid #31525c;border-radius:7px;font-size:11px}.place{position:absolute;color:#789aa2;font-size:18px}.live{color:#71e5a0}</style><div class=w><div class=tag>MINIT · LIVE DOGFOOD</div><h1>Seoul Metro Fleet</h1><p>Simulated locations. <span class=live>● moving every 1.2 sec</span></p><div id=map class=map><div class=road></div><div class="road r2"></div><div class="road r3"></div><span class=place style="left:16%;top:18%">Goyang</span><span class=place style="left:48%;top:36%">Seoul</span><span class=place style="left:76%;top:23%">Guri</span><span class=place style="left:20%;top:77%">Bucheon</span><span class=place style="left:63%;top:78%">Seongnam</span></div></div><script>let p=[[42,34],[55,48],[31,69],[73,32],[67,72]];p.forEach((x,i)=>{let d=document.createElement('div');d.className='m';d.id='m'+i;d.innerHTML='<div class=dot></div><div class=lbl>M-0'+(i+1)+' · en route</div>';map.appendChild(d)});function t(){p=p.map(x=>[Math.max(8,Math.min(92,x[0]+(Math.random()-.5)*7)),Math.max(9,Math.min(90,x[1]+(Math.random()-.5)*7))]);p.forEach((x,i)=>{let d=document.getElementById('m'+i);d.style.left=x[0]+'%';d.style.top=x[1]+'%'})}setInterval(t,1200);t()</script>
          EOF
          (cd /tmp/mdemo2/dash && minit deploy -p 8841 -- python -m http.server 8841 --bind 127.0.0.1)
          (cd /tmp/mdemo2/map && minit deploy -p 8842 -- python -m http.server 8842 --bind 127.0.0.1)
          curl -fsS http://127.0.0.1:8841 | grep -q 'Operations Dashboard'
          curl -fsS http://127.0.0.1:8842 | grep -q 'Seoul Metro Fleet'
      - name: Create and verify Minit public URLs
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/mdemo2/dash && minit run -p 8841 >/tmp/dash2.log 2>&1) &
          (cd /tmp/mdemo2/map && minit run -p 8842 >/tmp/map2.log 2>&1) &
          python - <<'PY'
          import pathlib,re,time,sys
          pat=re.compile(r'https://[\w-]+\.trycloudflare\.com'); fs={'dashboard':'/tmp/dash2.log','map':'/tmp/map2.log'}; out={}; end=time.time()+120
          while time.time()<end and len(out)<2:
              for n,f in fs.items():
                  p=pathlib.Path(f)
                  if n not in out and p.exists():
                      m=pat.search(p.read_text(errors='ignore'))
                      if m: out[n]=m.group(0)
              time.sleep(1)
          if len(out)<2: sys.exit('could not obtain both URLs: '+repr(out))
          pathlib.Path('/tmp/urls.txt').write_text('dashboard='+out['dashboard']+'\nmap='+out['map']+'\n')
          print(pathlib.Path('/tmp/urls.txt').read_text(),flush=True)
          PY
          DASH=$(sed -n 's/^dashboard=//p' /tmp/urls.txt); MAP=$(sed -n 's/^map=//p' /tmp/urls.txt)
          curl -fsS --retry 10 --retry-delay 2 "$DASH" | grep -q 'Operations Dashboard'
          curl -fsS --retry 10 --retry-delay 2 "$MAP" | grep -q 'Seoul Metro Fleet'
          echo 'verified=PASS' >> /tmp/urls.txt
      - uses: actions/upload-artifact@v4
        with:
          name: minit-live-urls
          path: /tmp/urls.txt
          retention-days: 1
      - name: Keep URLs alive for interactive testing
        run: sleep 1200
