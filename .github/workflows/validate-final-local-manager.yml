name: Final local manager validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-final-local-manager.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package and CLI
        id: validation
        continue-on-error: true
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
          minit --help
          minit snapshot --help
          minit autostart --help
          minit recovery --help
      - name: Record result
        run: |
          echo "${{ steps.validation.outcome }}" > final-local-manager-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-local-manager-validation.txt
          git commit -m "Record final local manager package validation" || true
          git push
