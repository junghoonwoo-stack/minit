name: Verify 0.1.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-release.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify fresh PyPI install and live path
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail

          python -m venv /tmp/minit-release-test
          PY=/tmp/minit-release-test/bin/python
          PIP=/tmp/minit-release-test/bin/pip
          MINIT=/tmp/minit-release-test/bin/minit

          # A new PyPI project can take a short time to become visible to installers.
          installed=0
          for i in $(seq 1 20); do
            if "$PIP" install --no-cache-dir --index-url https://pypi.org/simple minit-runtime==0.1.0; then
              installed=1
              break
            fi
            sleep 15
          done
          test "$installed" -eq 1

          "$MINIT" --help
          "$PY" -c 'from importlib.metadata import version; assert version("minit-runtime") == "0.1.0"'

          mkdir -p /tmp/minit-demo
          echo 'minit-release-0.1.0-ok' > /tmp/minit-demo/index.html
          cd /tmp/minit-demo
          "$PY" -m http.server 8000 >/tmp/minit-http.log 2>&1 &
          SERVER_PID=$!

          cd "$GITHUB_WORKSPACE"
          "$MINIT" run --port 8000 >/tmp/minit-live.log 2>&1 &
          MINIT_PID=$!

          cleanup() {
            kill "$MINIT_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          LIVE_URL=""
          for i in $(seq 1 40); do
            LIVE_URL=$(grep -Eo 'https://[A-Za-z0-9-]+\.trycloudflare\.com' /tmp/minit-live.log | head -1 || true)
            if [ -n "$LIVE_URL" ]; then break; fi
            sleep 2
          done
          test -n "$LIVE_URL"

          reached=0
          for i in $(seq 1 30); do
            if curl -fsS "$LIVE_URL" | grep -q 'minit-release-0.1.0-ok'; then
              reached=1
              break
            fi
            sleep 2
          done
          test "$reached" -eq 1

          printf 'PASS\npackage=minit-runtime\nversion=0.1.0\ninstall=pypi\ne2e=external-public-url\n' > /tmp/release-verification.txt

      - name: Record verification result
        shell: bash
        run: |
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            cp /tmp/release-verification.txt release-verification.txt
          else
            {
              echo "FAIL"
              echo "package=minit-runtime"
              echo "version=0.1.0"
              echo
              echo "--- minit log ---"
              tail -80 /tmp/minit-live.log 2>/dev/null || true
            } > release-verification.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-verification.txt
          git commit -m "Record 0.1.0 release verification" || true
          git push
