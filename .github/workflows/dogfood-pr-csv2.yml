name: PR Live CSV Minit Dogfood 2

on:
  pull_request:
    paths:
      - "dogfood-trigger-csv2.txt"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Minit
        run: python -m pip install -e .
      - name: Create CSV analysis app
        shell: bash
        run: |
          mkdir -p /tmp/minit-csv2
          cat >/tmp/minit-csv2/app.py <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import csv, io, json
          HTML=r'''<!doctype html><meta name=viewport content="width=device-width"><title>Minit CSV Analyzer</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#edf3fb;font:15px system-ui}.w{max-width:1050px;margin:auto;padding:34px}.tag{color:#80a8ff;font-weight:800;font-size:12px;letter-spacing:.12em}h1{font-size:40px;margin:7px 0}.sub{color:#9ba8ba}.warn{background:#211d10;border:1px solid #5c502c;color:#e9da8a;padding:12px;border-radius:11px;margin:18px 0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.btn{background:#6688f5;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.ghost{background:#192334}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.c,.p{background:#121b27;border:1px solid #29374b;border-radius:15px;padding:18px}.k{color:#8d9db2;font-size:11px;font-weight:700}.v{font-size:28px;font-weight:800;margin-top:7px}.local{color:#72d99c}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-top:12px}.metric{display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:8px;padding:10px 0;border-bottom:1px solid #273448;min-width:540px}.metrics{overflow:auto}.bars{height:270px;display:flex;align-items:end;gap:5px}.bar{flex:1;background:#7191fb;border-radius:5px 5px 2px 2px}.table{overflow:auto}.table table{border-collapse:collapse;width:100%;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid #273448;text-align:left;white-space:nowrap}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style><div class=w><div class=tag>MINIT · DOGFOOD #3</div><h1>CSV Analysis Workspace</h1><div class=sub>CSV parsing and numeric aggregation happen in the Minit-managed Python process running on this machine.</div><div class=warn>Test data only. This temporary <b>minit run</b> link is not the future private E2E path.</div><div class=actions><label class=btn>Choose CSV<input id=f type=file accept=.csv style="display:none"></label><button id=s class="btn ghost">Use sample sales CSV</button><span id=st class=sub>Ready</span></div><div id=res style="display:none"><div class=cards><div class=c><div class=k>ROWS</div><div id=rows class=v></div></div><div class=c><div class=k>COLUMNS</div><div id=cols class=v></div></div><div class=c><div class=k>NUMERIC</div><div id=nums class=v></div></div><div class=c><div class=k>COMPUTE</div><div class="v local">LOCAL</div></div></div><div class=grid><div class=p><div class=k>NUMERIC SUMMARY</div><div id=m class=metrics></div></div><div class=p><div class=k id=ct>DISTRIBUTION</div><div id=b class=bars></div></div></div><div class=p style="margin-top:12px"><div class=k>SAMPLE ROWS</div><div id=t class=table></div></div></div></div><script>const sample=`date,region,orders,revenue,returns\n2026-08-01,Seoul,124,18600000,3\n2026-08-02,Seoul,139,21100000,4\n2026-08-03,Busan,91,13700000,2\n2026-08-04,Daejeon,77,11200000,1\n2026-08-05,Seoul,151,22600000,5\n2026-08-06,Busan,104,15400000,2\n2026-08-07,Jeju,68,9800000,1\n2026-08-08,Seoul,163,24100000,3\n2026-08-09,Daejeon,88,12900000,2\n2026-08-10,Busan,117,17100000,2\n2026-08-11,Seoul,172,25300000,4\n2026-08-12,Jeju,73,10600000,1`;let esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),fmt=x=>Math.abs(x)>=1e6?(x/1e6).toFixed(1)+'M':Math.abs(x)>=1e3?(x/1e3).toFixed(1)+'K':(+x).toFixed(2);async function go(csv,name){st.textContent='Analyzing on local process…';let r=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv,name})}),x=await r.json();if(!r.ok){st.textContent=x.error;return}st.textContent='Analyzed '+name;res.style.display='block';rows.textContent=x.rows;cols.textContent=x.columns.length;nums.textContent=x.numeric.length;m.innerHTML=x.numeric.map(n=>`<div class=metric><b>${esc(n.name)}</b><span>avg ${fmt(n.avg)}</span><span>min ${fmt(n.min)}</span><span>max ${fmt(n.max)}</span><span>sum ${fmt(n.sum)}</span></div>`).join('');b.innerHTML='';if(x.chart){ct.textContent='DISTRIBUTION · '+x.chart.name;let mx=Math.max(...x.chart.values,1);x.chart.values.forEach(v=>{let e=document.createElement('i');e.className='bar';e.style.height=(8+90*v/mx)+'%';e.title=v;b.appendChild(e)})}t.innerHTML='<table><tr>'+x.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+x.preview.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table>'}s.onclick=()=>go(sample,'sample-sales.csv');f.onchange=async()=>{let x=f.files[0];if(x)go(await x.text(),x.name)}</script>'''
          def analyze(text):
              if len(text.encode())>2_000_000: raise ValueError('2 MB demo limit')
              rows=list(csv.reader(io.StringIO(text)))
              if len(rows)<2: raise ValueError('Need a header and data rows')
              h=rows[0]; data=[(r+['']*len(h))[:len(h)] for r in rows[1:] if any(v.strip() for v in r)][:5000]; nums=[]
              for i,n in enumerate(h):
                  vals=[]
                  try:
                      for r in data:
                          if r[i].strip(): vals.append(float(r[i].replace(',','')))
                  except ValueError: continue
                  if vals: nums.append({'name':n,'avg':sum(vals)/len(vals),'min':min(vals),'max':max(vals),'sum':sum(vals),'values':vals[:40]})
              chart=None
              if nums: chart={'name':nums[0]['name'],'values':nums[0].pop('values')}
              for n in nums: n.pop('values',None)
              return {'rows':len(data),'columns':h,'numeric':nums,'chart':chart,'preview':data[:8]}
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  z=HTML.encode();self.send_response(200);self.send_header('Content-Type','text/html; charset=utf-8');self.send_header('Cache-Control','no-store');self.end_headers();self.wfile.write(z)
              def do_POST(self):
                  try:
                      n=int(self.headers.get('Content-Length','0')); p=json.loads(self.rfile.read(n)); out=analyze(p.get('csv','')); code=200
                  except Exception as e: out={'error':str(e)};code=400
                  z=json.dumps(out).encode();self.send_response(code);self.send_header('Content-Type','application/json');self.send_header('Cache-Control','no-store');self.end_headers();self.wfile.write(z)
              def log_message(self,*a): pass
          ThreadingHTTPServer(('127.0.0.1',8842),H).serve_forever()
          PY
      - name: Deploy locally with Minit
        shell: bash
        run: |
          cd /tmp/minit-csv2
          minit deploy -p 8842 -- python app.py
          curl -fsS http://127.0.0.1:8842 | grep -q 'CSV Analysis Workspace'
          minit status
      - name: Create and verify public analysis path
        shell: bash
        run: |
          cd /tmp/minit-csv2
          minit run -p 8842 >/tmp/tunnel.log 2>&1 &
          python - <<'PY'
          import pathlib,re,time,urllib.request,json,sys
          p=pathlib.Path('/tmp/tunnel.log'); pat=re.compile(r'https://[\w-]+\.trycloudflare\.com'); end=time.time()+150; url=None
          while time.time()<end:
              if p.exists():
                  m=pat.search(p.read_text(errors='ignore'))
                  if m:url=m.group(0);break
              time.sleep(2)
          if not url: print(p.read_text(errors='ignore'));sys.exit(1)
          for _ in range(15):
              try:
                  if 'CSV Analysis Workspace' in urllib.request.urlopen(url,timeout=5).read().decode(errors='ignore'):break
              except Exception: pass
              time.sleep(2)
          else:sys.exit('GET verify failed')
          data=json.dumps({'csv':'x,y\n1,2\n3,4','name':'smoke.csv'}).encode(); req=urllib.request.Request(url+'/analyze',data=data,headers={'Content-Type':'application/json'},method='POST'); out=json.loads(urllib.request.urlopen(req,timeout=10).read())
          assert out['rows']==2 and len(out['numeric'])==2, out
          pathlib.Path('/tmp/csv2-url.txt').write_text(url+'\n'); print('MINIT_CSV_PUBLIC_URL='+url);print('MINIT_CSV_PUBLIC_ANALYSIS=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minit-csv2-live-url
          path: /tmp/csv2-url.txt
          retention-days: 1
      - name: Keep live
        run: sleep 1800
