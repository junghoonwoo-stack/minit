name: Validate local management next

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-local-management-next.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run final local-management validation
        shell: bash
        run: |
          LOG=/tmp/minit-next-validation.txt
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          set +e

          python -m pip install -e ".[dev]"
          install_rc=$?
          pytest -q
          test_rc=$?

          minit --help >/tmp/minit-help.txt
          help_rc=$?
          minit recovery --help >/tmp/minit-recovery-help.txt
          recovery_help_rc=$?

          rollback_rc=99
          data_ok=1
          perms_ok=1
          deploy_rc=99
          deploy_ready=0
          stop_rc=99
          log_perms_ok=1

          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            rm -rf /tmp/minit-rollback-e2e
            mkdir -p /tmp/minit-rollback-e2e
            cd /tmp/minit-rollback-e2e
            printf "print('v1')\n" > app.py
            mkdir -p .minit/data
            printf "DATA-V1\n" > .minit/data/state.db

            minit snapshot create --label v1
            snapshot_id=$(minit snapshot list | head -1 | awk '{print $1}')
            printf "print('v2')\n" > app.py
            printf "DATA-V2\n" > .minit/data/state.db
            minit rollback "$snapshot_id"
            rollback_rc=$?
            grep -q "v1" app.py
            code_ok=$?
            grep -q "DATA-V2" .minit/data/state.db
            data_ok=$?

            if [ "$(stat -c '%a' .minit)" = "700" ] && [ "$(stat -c '%a' .minit/app.json)" = "600" ] && [ "$(stat -c '%a' .minit/snapshots/index.json)" = "600" ]; then
              perms_ok=0
            fi

            rm -rf /tmp/minit-deploy-latest
            mkdir -p /tmp/minit-deploy-latest
            cd /tmp/minit-deploy-latest
            cat > app.py <<'PY'
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          ThreadingHTTPServer(("127.0.0.1", 8780), SimpleHTTPRequestHandler).serve_forever()
          PY
            minit deploy --port 8780 -- python app.py
            deploy_rc=$?
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8780 >/dev/null; then deploy_ready=1; break; fi
              sleep 1
            done
            if [ "$(stat -c '%a' .minit/runtime.json)" = "600" ] && [ "$(stat -c '%a' .minit/logs/app.log)" = "600" ] && [ "$(stat -c '%a' .minit/logs/supervisor.log)" = "600" ]; then
              log_perms_ok=0
            fi
            minit stop
            stop_rc=$?
          else
            code_ok=1
          fi

          echo "install_rc=$install_rc"
          echo "test_rc=$test_rc"
          echo "help_rc=$help_rc"
          echo "recovery_help_rc=$recovery_help_rc"
          echo "rollback_rc=$rollback_rc"
          echo "code_ok=$code_ok"
          echo "data_ok=$data_ok"
          echo "perms_ok=$perms_ok"
          echo "deploy_rc=$deploy_rc"
          echo "deploy_ready=$deploy_ready"
          echo "log_perms_ok=$log_perms_ok"
          echo "stop_rc=$stop_rc"

          result=failure
          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ] && [ "$help_rc" -eq 0 ] && [ "$recovery_help_rc" -eq 0 ] && [ "$rollback_rc" -eq 0 ] && [ "$code_ok" -eq 0 ] && [ "$data_ok" -eq 0 ] && [ "$perms_ok" -eq 0 ] && [ "$deploy_rc" -eq 0 ] && [ "$deploy_ready" -eq 1 ] && [ "$log_perms_ok" -eq 0 ] && [ "$stop_rc" -eq 0 ]; then
            result=success
          fi
          echo "result=$result"

          cd "$GITHUB_WORKSPACE"
          cp "$LOG" local-management-next-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-management-next-validation.txt
          git commit -m "Record final local management validation" || true
          git push
