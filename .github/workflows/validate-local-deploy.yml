# Temporary validation workflow; remove after a clean result.
name: Validate local deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-local-deploy.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run diagnostic validation
        shell: bash
        run: |
          LOG=/tmp/local-deploy-validation.txt
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          set +e

          echo "=== install ==="
          python -m pip install -e ".[dev]"
          install_rc=$?

          echo "=== pytest ==="
          pytest -q
          test_rc=$?

          deploy_rc=99
          ready=0
          status_rc=99
          status_running=1
          status_healthy=1
          stop_rc=99
          stopped=0
          recovery_rc=99
          recovered=0
          restart_count_ok=1

          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            echo "=== local deploy e2e ==="
            rm -rf /tmp/minit-local-deploy-e2e
            mkdir -p /tmp/minit-local-deploy-e2e
            cd /tmp/minit-local-deploy-e2e

            minit deploy --port 8765 -- python -m http.server 8765 --bind 127.0.0.1
            deploy_rc=$?

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8765 >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done

            echo "=== status ==="
            minit status | tee /tmp/minit-status.txt
            status_rc=${PIPESTATUS[0]}
            grep -q "process:         running" /tmp/minit-status.txt
            status_running=$?
            grep -q "health:          healthy" /tmp/minit-status.txt
            status_healthy=$?

            echo "=== stop ==="
            minit stop
            stop_rc=$?
            for i in $(seq 1 20); do
              if ! curl -fsS http://127.0.0.1:8765 >/dev/null 2>&1; then
                stopped=1
                break
              fi
              sleep 0.5
            done

            echo "=== restart-on-failure e2e ==="
            rm -rf /tmp/minit-recovery-e2e
            mkdir -p /tmp/minit-recovery-e2e
            cd /tmp/minit-recovery-e2e
            cat > crash_then_serve.py <<'PY'
          from pathlib import Path
          import sys
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler

          marker = Path(".first-crash-done")
          if not marker.exists():
              marker.write_text("done", encoding="utf-8")
              raise SystemExit(7)

          ThreadingHTTPServer(("127.0.0.1", 8766), SimpleHTTPRequestHandler).serve_forever()
          PY

            minit deploy --port 8766 --restart on-failure -- python crash_then_serve.py
            recovery_rc=$?
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8766 >/dev/null; then
                recovered=1
                break
              fi
              sleep 1
            done
            minit status | tee /tmp/minit-recovery-status.txt
            grep -q "restarts:        1" /tmp/minit-recovery-status.txt
            restart_count_ok=$?
            minit stop || true
          fi

          echo "=== summary ==="
          echo "install_rc=$install_rc"
          echo "test_rc=$test_rc"
          echo "deploy_rc=$deploy_rc"
          echo "ready=$ready"
          echo "status_rc=$status_rc"
          echo "status_running=$status_running"
          echo "status_healthy=$status_healthy"
          echo "stop_rc=$stop_rc"
          echo "stopped=$stopped"
          echo "recovery_rc=$recovery_rc"
          echo "recovered=$recovered"
          echo "restart_count_ok=$restart_count_ok"

          overall=failure
          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ] && [ "$deploy_rc" -eq 0 ] && [ "$ready" -eq 1 ] && [ "$status_rc" -eq 0 ] && [ "$status_running" -eq 0 ] && [ "$status_healthy" -eq 0 ] && [ "$stop_rc" -eq 0 ] && [ "$stopped" -eq 1 ] && [ "$recovery_rc" -eq 0 ] && [ "$recovered" -eq 1 ] && [ "$restart_count_ok" -eq 0 ]; then
            overall=success
          fi
          echo "result=$overall"

          cd "$GITHUB_WORKSPACE"
          cp "$LOG" local-deploy-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-deploy-validation.txt
          git commit -m "Record local deploy diagnostic result" || true
          git push
