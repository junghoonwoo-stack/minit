name: Bug report
description: Something did not work as expected when using Minit.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Minit more reliable.

        **Before posting:** remove API keys, tokens, private URLs, personal data, company data, and any other secrets from logs or screenshots.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows x64
        - Linux x64
        - Linux ARM64
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.5"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install Minit?
      options:
        - pipx from GitHub
        - uv tool from GitHub
        - git clone + pip install -e .
        - Other
    validations:
      required: true

  - type: input
    id: framework
    attributes:
      label: App / framework
      description: What kind of local web app were you trying to share?
      placeholder: "e.g. Streamlit, FastAPI, Flask, Next.js, Vite, Gradio"

  - type: input
    id: port
    attributes:
      label: Local port
      placeholder: "e.g. 8000"

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
      placeholder: "minit run --port 8000"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the smallest useful output. Remove secrets and sensitive information first.
      render: text

  - type: checkboxes
    id: safety
    attributes:
      label: Security check
      options:
        - label: I removed secrets, private URLs, personal data, and sensitive company information from this report.
          required: true
