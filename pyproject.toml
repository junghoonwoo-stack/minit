[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minit-runtime"
version = "0.1.0"
description = "From localhost to real users in one command."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Junghoon Woo"}]
keywords = ["localhost", "developer-tools", "tunnel", "deployment", "ai-coding", "prototyping"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://junghoonwoo-stack.github.io/minit/"
Repository = "https://github.com/junghoonwoo-stack/minit"
Issues = "https://github.com/junghoonwoo-stack/minit/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
minit = "minit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["minit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
