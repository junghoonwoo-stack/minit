[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minit-runtime"
version = "0.0.2"
description = "From localhost to real users in one command."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Junghoon Woo"}]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
minit = "minit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["minit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
